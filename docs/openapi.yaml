      properties:
        amount:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
        reason:
          type: string

    CreateTopUpOrderRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0

    WalletTopUpOrderData:
      type: object
      properties:
        razorpay_key_id:
          type: string
        gateway_order_id:
          type: string
        amount:
          type: integer
          format: int64
          description: Amount in smallest currency unit (paise)
        currency:
          type: string
          example: INR

    VerifyTopUpPaymentRequest:
      type: object
      required:
        - gateway_order_id
        - gateway_payment_id
        - razorpay_signature
      properties:
        gateway_order_id:
          type: string
        gateway_payment_id:
          type: string
        razorpay_signature:
          type: string

    CreatePaymentOrderRequest:
      type: object
      required:
        - order_id
      properties:
        order_id:
          type: string
          format: uuid

    CreateRazorpayOrderData:
      type: object
      properties:
        razorpay_order_id:
          type: string

    PaymentVerifyRequest:
      type: object
      required:
        - order_id
        - razorpay_order_id
        - razorpay_payment_id
        - razorpay_signature
      properties:
        order_id:
          type: string
          format: uuid
        razorpay_order_id:
          type: string
        razorpay_payment_id:
          type: string
        razorpay_signature:
          type: string

    RazorpayWebhookPayload:
      type: object
      properties:
        event:
          type: string
          example: payment.captured
        payload:
          type: object
          properties:
            payment:
              type: object
              properties:
                entity:
                  type: object
                  properties:
                    id:
                      type: string
                    order_id:
                      type: string
                    amount:
                      type: integer
                      format: int64
                    currency:
                      type: string
                    status:
                      type: string

    # --- Referrals & Reviews ---
    ReferralSummaryDTO:
      type: object
      properties:
        total_referrals:
          type: integer
          format: int64
        pending_referrals:
          type: integer
          format: int64
        completed_referrals:
          type: integer
          format: int64
        total_rewards_earned:
          type: number
          format: double

    ReferralItemDTO:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [pending, completed]
        reward_status:
          type: string
          enum: [pending, completed]
        reward_earned:
          type: number
          format: double
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true

    ReferralDashboardResponse:
      type: object
      properties:
        referral_code:
          type: string
        referral_link:
          type: string
        summary:
          $ref: '#/components/schemas/ReferralSummaryDTO'
        referrals:
          type: array
          items:
            $ref: '#/components/schemas/ReferralItemDTO'
        pagination:
          $ref: '#/components/schemas/PaginationDTO'

    AdminReferralDashboardResponse:
      type: object
      properties:
        total_referrals:
          type: integer
          format: int64
        pending_referrals:
          type: integer
          format: int64
        completed_referrals:
          type: integer
          format: int64
        referrer_rewards_paid:
          type: number
          format: double
        referred_rewards_paid:
          type: number
          format: double
        total_rewards_paid:
          type: number
          format: double
        conversion_rate:
          type: number
          format: double

    TopReferrerDTO:
      type: object
      properties:
        referrer_id:
          type: integer
        name:
          type: string
        successful_referrals:
          type: integer
          format: int64
        rewards_earned:
          type: number
          format: double

    TopReferrersResponse:
      type: object
      properties:
        referrers:
          type: array
          items:
            $ref: '#/components/schemas/TopReferrerDTO'

    AdminReferralItemDTO:
      type: object
      properties:
        id:
          type: integer
        referrer_id:
          type: integer
        referrer_name:
          type: string
        referred_user_id:
          type: integer
        referred_user_name:
          type: string
        status:
          type: string
          enum: [pending, completed]
        referrer_reward:
          type: number
          format: double
        referred_reward:
          type: number
          format: double
        referrer_reward_status:
          type: string
          enum: [pending, completed]
        referred_reward_status:
          type: string
          enum: [pending, completed]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true

    AdminReferralsResponse:
      type: object
      properties:
        referrals:
          type: array
          items:
            $ref: '#/components/schemas/AdminReferralItemDTO'
        pagination:
          $ref: '#/components/schemas/PaginationDTO'

    ReferralSettingsResponse:
      type: object
      properties:
        referrer_reward:
          type: number
          format: double
        referred_reward:
          type: number
          format: double
        minimum_order_amount:
          type: number
          format: double
        is_active:
          type: boolean
        updated_at:
          type: string
          format: date-time

    UpdateReferralSettingsRequest:
      type: object
      required:
        - referrer_reward
        - referred_reward
        - minimum_order_amount
        - is_active
      properties:
        referrer_reward:
          type: number
          format: double
          minimum: 0
        referred_reward:
          type: number
          format: double
          minimum: 0
        minimum_order_amount:
          type: number
          format: double
          minimum: 0
        is_active:
          type: boolean

    CreateReviewRequest:
      type: object
      required:
        - order_item_id
        - rating
      properties:
        order_item_id:
          type: integer
          minimum: 1
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true

    UpdateReviewRequest:
      type: object
      required:
        - rating
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true

    UpdateReviewVisibilityRequest:
      type: object
      required:
        - is_visible
      properties:
        is_visible:
          type: boolean

    ReviewResponse:
      type: object
      properties:
        id:
          type: integer
        product_id:
          type: integer
        product_name:
          type: string
        user_name:
          type: string
        order_item_id:
          type: integer
        rating:
          type: integer
        comment:
          type: string
          nullable: true
        is_visible:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ReviewListResponse:
      type: object
      properties:
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/ReviewResponse'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          format: int64
        total_pages:
          type: integer

    # --- Dashboard & Reports ---
    DashboardOverview:
      type: object
      description: Domain `models.DashboardOverview` serialized without custom JSON tags (PascalCase keys)
      properties:
        TotalRevenue:
          type: number
          format: double
        TotalOrders:
          type: integer
          format: int64
        TotalCustomers:
          type: integer
          format: int64
        TotalProducts:
          type: integer
          format: int64
        PendingOrders:
          type: integer
          format: int64
        ConfirmedOrders:
          type: integer
          format: int64
        ProcessingOrders:
          type: integer
          format: int64
        ShippedOrders:
          type: integer
          format: int64
        DeliveredOrders:
          type: integer
          format: int64
        CancelledOrders:
          type: integer
          format: int64
        ReturnedOrders:
          type: integer
          format: int64

    SalesData:
      type: object
      properties:
        date:
          type: string
          format: date-time
        total_revenue:
          type: number
          format: double
        total_orders:
          type: integer
          format: int64

    OrderStats:
      type: object
      properties:
        total_orders:
          type: integer
          format: int64
        pending_orders:
          type: integer
          format: int64
        confirmed_orders:
          type: integer
          format: int64
        processing_orders:
          type: integer
          format: int64
        shipped_orders:
          type: integer
          format: int64
        delivered_orders:
          type: integer
          format: int64
        cancelled_orders:
          type: integer
          format: int64
        returned_orders:
          type: integer
          format: int64

    CustomerStats:
      type: object
      properties:
        total_customers:
          type: integer
          format: int64
        blocked_customers:
          type: integer
          format: int64
        verified_customers:
          type: integer
          format: int64
        unverified_customers:
          type: integer
          format: int64

    TopProduct:
      type: object
      properties:
        product_id:
          type: integer
        product_name:
          type: string
        units_sold:
          type: integer
          format: int64
        total_orders:
          type: integer
          format: int64
        revenue:
          type: number
          format: double

    TopCategory:
      type: object
      properties:
        category_id:
          type: integer
          format: int64
        category_name:
          type: string
        units_sold:
          type: integer
          format: int64
        revenue:
