      responses:
        '200':
          $ref: '#/components/responses/SuccessMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using reset cookie
      description: Reads the reset token from the `password_reset` cookie set by OTP verification and updates the user's password.
      operationId: resetPassword
      security:
        - PasswordResetCookie: []
      requestBody:
        required: true
