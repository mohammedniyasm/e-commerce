openapi: 3.0.3
info:
  title: E-Commerce API
  version: 1.0.0
  description: |
    Complete REST API specification for the E-Commerce backend (base path `/api/v1`).

    ### Authentication & Cookies
    - Protected customer and admin routes require an `Authorization: Bearer <jwt>` access token (`BearerAuth`).
    - Admin routes under `/api/v1/admin/*` additionally require the authenticated user to have role `admin`.
    - Login, Google OAuth login, Admin login, and token refresh set an HttpOnly refresh token cookie (`refresh_token` by default, configurable via `REFRESH_TOKEN_COOKIE_NAME`).
    - Forgot-password OTP verification sets an HttpOnly password reset cookie (`password_reset` by default, configurable via `PASSWORD_RESET_COOKIE_NAME`, scoped to `/api/v1/auth`).
    - Razorpay webhook endpoints verify HMAC-SHA256 signatures passed via the `X-Razorpay-Signature` header.

    ### Rate Limiting
    - Auth and OTP endpoints apply Redis-backed rate limiting, setting `X-RateLimit-Limit` and returning `429 Too Many Requests` with `Retry-After` (seconds) when exceeded.

    ### Response Envelope
    - Most JSON endpoints wrap payloads in `APIResponse` (`success`, `message`, optional `data`, optional `error`).
    - Exceptions: `GET /api/v1/health` returns `{"status": "ok"}`, JSON bind failure on `POST /api/v1/auth/register` returns `{"error": "invalid request"}`, and invoice/report exports stream binary PDF or Excel files.
servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Health
    description: Service health check
  - name: Auth
    description: Customer authentication, email verification, and password reset
  - name: Storefront
    description: Public catalog, product discovery, guest cart validation, and public product reviews
  - name: Webhooks
    description: Payment and wallet gateway webhook callbacks
  - name: User Profile
    description: Authenticated customer profile management
  - name: User Addresses
    description: Authenticated customer shipping addresses
  - name: Cart
    description: Customer shopping cart management
  - name: Wishlist
    description: Customer wishlist management
  - name: Coupons
    description: Customer coupon validation
  - name: Orders
    description: Customer order placement, listing, tracking, cancellation, and invoice download
  - name: Shipments
    description: Customer shipment and tracking history
  - name: Returns
    description: Customer return and exchange requests
  - name: Wallet
    description: Customer wallet balance, transactions, and Razorpay top-up
  - name: Referrals
    description: Customer referral dashboard and rewards
  - name: Payments
    description: Customer Razorpay checkout order creation and verification
  - name: Reviews
    description: Customer product reviews
  - name: Admin Auth
    description: Administrator authentication and password recovery
  - name: Admin Profile
    description: Authenticated administrator profile management
  - name: Admin Addresses
    description: Authenticated administrator address management
  - name: Admin Users
    description: Customer account administration
  - name: Admin Categories
    description: Category administration and soft-delete recovery
  - name: Admin Brands
    description: Brand and logo administration
  - name: Admin Products
    description: Product administration and visibility controls
  - name: Admin Variants
    description: Product variant and SKU administration
  - name: Admin Product Images
    description: Product and variant image uploads and ordering
  - name: Admin Notifications
    description: Admin notification feed and read status
  - name: Admin Coupons
    description: Coupon CRUD and usage tracking
  - name: Admin Orders
    description: Order management, COD verification, and wallet refunds
  - name: Admin Shipments
    description: Shipment creation, status updates, and tracking logs
  - name: Admin Returns
    description: Return/exchange workflow, replacement orders, and return shipments
  - name: Admin Wallets
    description: User wallet inspection and manual credits
  - name: Admin Referrals
    description: Referral program analytics, top referrers, and settings
  - name: Admin Reviews
    description: Review moderation and visibility control
  - name: Admin Dashboard
    description: Sales, order, customer, and top-performer analytics
  - name: Admin Reports
    description: Aggregated reports and PDF/Excel exports

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token passed as `Authorization Bearer <token>`
    RefreshTokenCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly refresh token cookie (cookie name configurable via `REFRESH_TOKEN_COOKIE_NAME`)
    PasswordResetCookie:
      type: apiKey
      in: cookie
      name: password_reset
      description: HttpOnly password reset verification cookie (cookie name configurable via `PASSWORD_RESET_COOKIE_NAME`)
    RazorpaySignature:
      type: apiKey
      in: header
      name: X-Razorpay-Signature
      description: Razorpay HMAC-SHA256 webhook signature

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: Numeric resource ID
      schema:
        type: integer
        format: int64
        minimum: 1
    UuidIdParam:
      name: id
      in: path
      required: true
      description: UUID resource ID
      schema:
        type: string
        format: uuid
    OrderIdParam:
      name: order_id
      in: path
      required: true
      description: Order UUID
      schema:
        type: string
        format: uuid
    OrderNumberParam:
      name: order_number
      in: path
      required: true
      description: Human-readable order number
      schema:
        type: string
    ShipmentIdParam:
      name: shipment_id
      in: path
      required: true
      description: Numeric shipment ID
      schema:
        type: integer
        format: int64
        minimum: 1
    ItemIdParam:
      name: itemId
      in: path
      required: true
      description: Numeric item or product ID
      schema:
        type: integer
        format: int64
        minimum: 1
    UserIdParam:
      name: userId
      in: path
      required: true
      description: Numeric user ID
      schema:
        type: integer
        format: int64
        minimum: 1
    SlugParam:
      name: slug
      in: path
      required: true
      description: URL slug identifier
      schema:
        type: string
    SearchQuery:
      name: search
      in: query
      required: false
      description: Case-insensitive search term
      schema:
        type: string
    PageQuery:
      name: page
      in: query
      required: false
      description: Page number (1-indexed)
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Items per page
      schema:
        type: integer
        minimum: 1
        default: 10
    SortNewOldQuery:
      name: sort
      in: query
      required: false
      description: Sort direction by creation time
      schema:
        type: string
        enum: [new, old]
        default: new
    StartDateQuery:
      name: start_date
      in: query
      required: false
      description: Start date filter (`YYYY-MM-DD`)
      schema:
        type: string
        format: date
    EndDateQuery:
      name: end_date
      in: query
      required: false
      description: End date filter (`YYYY-MM-DD`)
      schema:
        type: string
        format: date
    GroupByQuery:
      name: group_by
      in: query
      required: false
      description: Aggregation bucket interval
      schema:
        type: string
        enum: [day, week, month, year]
        default: day

  responses:
    SuccessMessageResponse:
      description: Operation succeeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponseBase'
    BadRequestResponse:
      description: Invalid request parameters, body, or domain validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponseBase'
    UnauthorizedResponse:
      description: Missing, invalid, or expired authentication credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponseBase'
    ForbiddenResponse:
      description: Insufficient permissions or blocked account
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponseBase'
    NotFoundResponse:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponseBase'
    ConflictResponse:
      description: Resource conflict or invalid state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponseBase'
    TooManyRequestsResponse:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying
          schema:
            type: string
        X-RateLimit-Limit:
          description: Maximum requests allowed in the current window
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponseBase'
    InternalServerErrorResponse:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponseBase'
    PdfDownloadResponse:
      description: Binary PDF document
      headers:
        Content-Disposition:
          schema:
            type: string
            example: attachment; filename="report.pdf"
      content:
        application/pdf:
          schema:
            type: string
            format: binary
    ExcelDownloadResponse:
      description: Binary Excel (XLSX) workbook
      headers:
        Content-Disposition:
          schema:
            type: string
            example: attachment; filename="report.xlsx"
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary

  schemas:
    APIResponseBase:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
        message:
          type: string
        error:
          type: string

    APIResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          nullable: true
        error:
          type: string

    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    RegisterBindError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: invalid request

    PaginationDTO:
      type: object
      required:
        - total
        - limit
        - offset
      properties:
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer

    # --- Auth ---
    SignupRequest:
      type: object
      required:
        - name
        - email
        - phone
        - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 30
          description: Letters, spaces, hyphens, or apostrophes only
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: '^[0-9]{10}$'
        password:
          type: string
          format: password
          minLength: 8
          description: Must contain uppercase, lowercase, digit, and special character
        referral_code:
          type: string

    UserResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string

    GoogleLoginRequest:
      type: object
      required:
        - id_token
      properties:
        id_token:
          type: string
        referral_code:
          type: string

    SendVerificationOTPRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    VerifyEmailRequest:
      type: object
      required:
        - otp
      properties:
        otp:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^[0-9]{6}$'

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    VerifyForgotPasswordRequest:
      type: object
      required:
        - email
        - otp
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^[0-9]{6}$'

    ResetPasswordRequest:
      type: object
      required:
        - new_password
      properties:
        new_password:
          type: string
          format: password
          minLength: 8

    # --- Profile & Addresses ---
    ProfileResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        profile_image:
          type: string
        email_verified_at:
          type: string
          format: date-time
          nullable: true

    UpdateProfileRequest:
      type: object
      required:
        - name
        - phone
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 30
        phone:
          type: string
          pattern: '^[0-9]{10}$'

    ChangePasswordRequest:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8

    ChangeEmailRequest:
      type: object
      required:
        - new_email
      properties:
        new_email:
          type: string
          format: email

    VerifyEmailChangeRequest:
      type: object
      required:
        - otp
      properties:
        otp:
          type: string
          minLength: 6
          maxLength: 6

    UploadProfileImageData:
      type: object
      properties:
        profile_image:
          type: string
          format: uri

    AddAddressRequest:
      type: object
      required:
        - name
        - phone
        - address_line1
        - city
        - postal_code
        - state
      properties:
        name:
          type: string
        phone:
          type: string
        address_line1:
          type: string
        address_line_2:
          type: string
        city:
          type: string
        postal_code:
          type: string
        state:
          type: string
        country:
          type: string
        is_default:
          type: boolean

    UpdateAddressRequest:
      $ref: '#/components/schemas/AddAddressRequest'

    AddressResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        address_line1:
          type: string
        address_line_2:
          type: string
        city:
          type: string
        postal_code:
          type: string
        state:
          type: string
        country:
          type: string
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true

    # --- Admin Users ---
    AdminAddCustomerRequest:
      type: object
      required:
        - name
        - email
        - phone
        - password
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          format: password
          minLength: 8

    AdminUpdateCustomerRequest:
      type: object
      required:
        - name
        - email
        - phone
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string

    AdminUserResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        profile_image:
          type: string
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        role:
          type: string
          enum: [user, admin]
        is_blocked:
          type: boolean
        last_seen:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    AdminUserListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserResponse'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          format: int64
        total_pages:
          type: integer

    # --- Categories & Brands ---
    CreateCategoryRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true

    UpdateCategoryRequest:
      $ref: '#/components/schemas/CreateCategoryRequest'

    CategoryResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CategoryListResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryResponse'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          format: int64
        total_pages:
          type: integer

    StoreCategoryResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    CreateBrandRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true

    UpdateBrandRequest:
      $ref: '#/components/schemas/CreateBrandRequest'

    BrandResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        logo:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BrandListResponse:
      type: object
      properties:
        brands:
          type: array
          items:
            $ref: '#/components/schemas/BrandResponse'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          format: int64
        total_pages:
          type: integer

    StoreBrandResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        logo_url:
          type: string
          nullable: true

    # --- Products, Variants, Images & Storefront ---
    CreateProductRequest:
      type: object
      required:
        - name
        - category_id
        - brand_id
      properties:
        name:
          type: string
        short_description:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        category_id:
          type: integer
          format: int64
        brand_id:
          type: integer
          format: int64

    UpdateProductRequest:
      $ref: '#/components/schemas/CreateProductRequest'

    ProductResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        short_description:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        category_id:
          type: integer
        brand_id:
          type: integer
        is_active:
          type: boolean
        is_listed:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductListResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          format: int64
        total_pages:
          type: integer

    CreateProductVariantRequest:
      type: object
      required:
        - sku
        - mrp
        - selling_price
      properties:
        size:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        sku:
          type: string
        mrp:
          type: number
          format: double
        selling_price:
          type: number
          format: double
        stock:
          type: integer

    UpdateProductVariantRequest:
      type: object
      required:
        - sku
        - mrp
        - selling_price
      properties:
        size:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        sku:
          type: string
        mrp:
          type: number
          format: double
        selling_price:
          type: number
          format: double
        stock:
          type: integer
        is_active:
          type: boolean
          nullable: true

    ProductVariantResponse:
      type: object
      properties:
        id:
          type: integer
        product_id:
          type: integer
        size:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        sku:
          type: string
        mrp:
          type: number
          format: double
        selling_price:
          type: number
          format: double
        stock:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateProductImageRequest:
      type: object
      properties:
        variant_id:
          type: integer
          format: int64
          nullable: true
        display_order:
          type: integer
          nullable: true
        is_primary:
          type: boolean
          nullable: true

    ProductImageResponse:
      type: object
      properties:
        id:
          type: integer
        product_id:
          type: integer
        variant_id:
          type: integer
          nullable: true
        image_url:
          type: string
        display_order:
          type: integer
        is_primary:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    StoreProductImageResponse:
      type: object
      properties:
        id:
          type: integer
        image_url:
          type: string

    StoreProductResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        short_description:
          type: string
          nullable: true
        category_id:
          type: integer
        category_name:
          type: string
        brand_id:
          type: integer
        brand_name:
          type: string
        min_price:
          type: number
          format: double
        max_price:
          type: number
          format: double
        primary_image:
          allOf:
            - $ref: '#/components/schemas/StoreProductImageResponse'
          nullable: true
        in_stock:
          type: boolean
        created_at:
          type: string
          format: date-time

    StoreProductListResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/StoreProductResponse'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          format: int64
        total_pages:
          type: integer

    StoreProductDetailCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    StoreProductDetailBrand:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        logo:
          type: string
          nullable: true

    StoreProductDetailImage:
      type: object
      properties:
        id:
          type: integer
        image_url:
          type: string
        display_order:
          type: integer
        is_primary:
          type: boolean

    StoreProductVariantDetail:
      type: object
      properties:
        id:
          type: integer
        size:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        sku:
          type: string
        mrp:
          type: number
          format: double
        selling_price:
          type: number
          format: double
        stock:
          type: integer
        in_stock:
          type: boolean
        images:
          type: array
          items:
            $ref: '#/components/schemas/StoreProductDetailImage'

    StoreProductDetailResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        short_description:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        category:
          $ref: '#/components/schemas/StoreProductDetailCategory'
        brand:
          $ref: '#/components/schemas/StoreProductDetailBrand'
        images:
          type: array
          items:
            $ref: '#/components/schemas/StoreProductDetailImage'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/StoreProductVariantDetail'
        min_price:
          type: number
          format: double
        max_price:
          type: number
          format: double
        in_stock:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RelatedProductResponse:
      type: object
      properties:
        id:
