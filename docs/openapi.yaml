paths:
  # ==========================================
  # Public Health & Storefront & Webhooks
  # ==========================================
  /api/v1/health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/products:
    get:
      tags: [Storefront]
      summary: List storefront products
      operationId: listStoreProducts
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - name: category_id
          in: query
          schema:
            type: integer
            format: int64
        - name: brand_id
          in: query
          schema:
            type: integer
            format: int64
        - name: min_price
          in: query
          schema:
            type: number
            format: double
        - name: max_price
          in: query
          schema:
            type: number
            format: double
        - name: sort
          in: query
          schema:
            type: string
            enum: [price_asc, price_desc, name_asc, name_desc]
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Storefront product list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponseBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StoreProductListResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/products/id/{id}:
    get:
      tags: [Storefront]
      summary: Get storefront product by ID
      operationId: getStoreProductById
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Storefront product details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponseBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StoreProductDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/v1/products/slug/{slug}:
    get:
      tags: [Storefront]
      summary: Get storefront product by slug
      operationId: getStoreProductBySlug
      parameters:
        - $ref: '#/components/parameters/SlugParam'
      responses:
        '200':
          description: Storefront product details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponseBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StoreProductDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/v1/products/{id}/recommendations:
    get:
      tags: [Storefront]
      summary: Get related products
      operationId: getRelatedProducts
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        '200':
          description: Related products
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponseBase'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/RelatedProductResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/v1/products/{id}/reviews:
    get:
      tags: [Storefront, Reviews]
      summary: List visible reviews for a product
      operationId: listProductReviews
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/PageQuery'
      responses:
        '200':
          description: Product review list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponseBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReviewListResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/categories:
    get:
      tags: [Storefront]
      summary: List active storefront categories
      operationId: listStoreCategories
      responses:
        '200':
          description: Active categories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponseBase'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/StoreCategoryResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/brands:
    get:
      tags: [Storefront]
      summary: List active storefront brands
      operationId: listStoreBrands
      responses:
        '200':
          description: Active brands
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponseBase'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/StoreBrandResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/guest-cart/validate:
    post:
      tags: [Storefront, Cart]
      summary: Validate guest cart items against current stock and prices
      operationId: validateGuestCart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateGuestCartRequest'
      responses:
        '200':
          description: Validation results for each requested variant
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponseBase'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/GuestCartItemValidationResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'

  /api/v1/payments/razorpay/webhook:
    post:
      tags: [Webhooks, Payments]
      summary: Handle Razorpay order payment webhook
      operationId: handleRazorpayWebhook
      security:
        - RazorpaySignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RazorpayWebhookPayload'
      responses:
        '200':
          $ref: '#/components/responses/SuccessMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/wallet/razorpay/webhook:
    post:
      tags: [Webhooks, Wallet]
      summary: Handle Razorpay wallet top-up webhook
      operationId: handleWalletRazorpayWebhook
      security:
        - RazorpaySignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RazorpayWebhookPayload'
      responses:
        '200':
          $ref: '#/components/responses/SuccessMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  # ==========================================
  # Customer Auth
  # ==========================================
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new customer account
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponseBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserResponse'
        '400':
          description: JSON bind error or field validation error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RegisterBindError'
                  - $ref: '#/components/schemas/APIResponseBase'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Customer login with email and password
      description: Sets HttpOnly refresh token cookie on success and returns a JWT access token.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: Sets the HttpOnly refresh token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponseBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/auth/google:
    post:
      tags: [Auth]
      summary: Customer login/signup with Google ID token
      description: Verifies Google `id_token`, optionally applies `referral_code` for new accounts, sets refresh token cookie, and returns access token.
      operationId: googleLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: Google login successful
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponseBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'

  /api/v1/auth/refresh-token:
    post:
      tags: [Auth]
      summary: Refresh customer access token
      description: Reads refresh token from HttpOnly cookie, rotates it, and issues a new access token.
      operationId: refreshToken
      security:
        - RefreshTokenCookie: []
      responses:
        '200':
          description: Access token refreshed
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponseBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset OTP
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/SuccessMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/v1/auth/forgot-password/verify-otp:
    post:
