          format: int64
        revenue:
          type: number
          format: double

    SalesReportSummary:
      type: object
      properties:
        total_sales:
          type: number
          format: double
        total_orders:
          type: integer
          format: int64
        total_units_sold:
          type: integer
          format: int64
        total_discount:
          type: number
          format: double

    SalesReportRow:
      type: object
      properties:
        date:
          type: string
